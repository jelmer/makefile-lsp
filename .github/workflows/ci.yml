---
name: CI

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build
        run: cargo build --release --verbose

  vscode-check:
    name: VS Code extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vscode-makefile
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-makefile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

  coc-check:
    name: coc-make checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./coc-make
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: coc-make/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
