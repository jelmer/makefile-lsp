---
name: Publish Extensions

"on":
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  check-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check versions match tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"

          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          VSCODE_VERSION=$(node -p "require('./vscode-makefile/package.json').version")
          COC_VERSION=$(node -p "require('./coc-make/package.json').version")

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "vscode-makefile version: $VSCODE_VERSION"
          echo "coc-make version: $COC_VERSION"

          FAILED=0
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$VSCODE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::vscode-makefile version ($VSCODE_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$COC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::coc-make version ($COC_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All versions match tag $TAG_VERSION"

  build-server:
    name: Build LSP (${{ matrix.target }})
    needs: [check-versions]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            vscode-target: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            vscode-target: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            vscode-target: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            vscode-target: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            vscode-target: win32-x64
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.vscode-target }}
          path: |
            target/${{ matrix.target }}/release/makefile-lsp
            target/${{ matrix.target }}/release/makefile-lsp.exe

  package-vscode:
    name: Package VS Code (${{ matrix.vscode-target }})
    needs: [build-server]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - vscode-target: linux-x64
            binary: makefile-lsp
          - vscode-target: linux-arm64
            binary: makefile-lsp
          - vscode-target: darwin-x64
            binary: makefile-lsp
          - vscode-target: darwin-arm64
            binary: makefile-lsp
          - vscode-target: win32-x64
            binary: makefile-lsp.exe
    defaults:
      run:
        working-directory: ./vscode-makefile
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-makefile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.vscode-target }}
          path: vscode-makefile/server

      - name: Make binary executable
        if: matrix.vscode-target != 'win32-x64'
        run: chmod +x server/${{ matrix.binary }}

      - name: Package platform-specific VSIX
        run: npx vsce package --target ${{ matrix.vscode-target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode-target }}
          path: vscode-makefile/*.vsix

  publish-vscode:
    name: Publish VS Code Extension
    needs: [package-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      - name: Publish to Open VSX Registry
        if: env.OPENVSX_TOKEN != ''
        working-directory: ./vscode-makefile
        run: |
          npm install -g ovsx
          for vsix in ../vsix/*.vsix; do
            ovsx publish "$vsix" -p ${{ secrets.OPENVSX_TOKEN }}
          done
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        continue-on-error: true

      - name: Publish to VS Code Marketplace
        if: env.VSCE_TOKEN != ''
        working-directory: ./vscode-makefile
        run: |
          npm install -g @vscode/vsce
          for vsix in ../vsix/*.vsix; do
            vsce publish --packagePath "$vsix" -p ${{ secrets.VSCE_TOKEN }}
          done
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        continue-on-error: true

  publish-coc-make:
    name: Publish coc-make to npm
    needs: [check-versions]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./coc-make
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: coc-make/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-vscode, publish-coc-make]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      - name: Download all server binaries
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: artifacts/servers

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.vsix
            artifacts/servers/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
