[package]
name = "makefile-lsp"
version = "0.1.0"
edition = "2021"
authors = ["Jelmer Vernooij <jelmer@jelmer.uk>"]
description = "Language Server Protocol implementation for Makefiles"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/jelmer/makefile-lsp"
keywords = ["lsp", "makefile", "language-server"]
categories = ["development-tools", "text-editors"]

[dependencies]
makefile-lossless = "0.3.37"
rowan = "0.16.1"
text-size = "1.1"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "makefile-lsp"
test = true

[dev-dependencies]
tempfile = "3"
